# sudo iptables -A INPUT -i wg0 -s 10.153.150.4 -p udp --dport 64738 -j ACCEPT

# per-client chains
# create chains
# iptables -N INPUT_CLIENT_BRYCE
# iptables -N FORWARD_CLIENT_BRYCE
#
# attach entry points
# iptables -A INPUT   -s 10.153.150.4 -j INPUT_CLIENT_BRYCE
# iptables -A FORWARD -s 10.153.150.4 -j FORWARD_CLIENT_BRYCE
#
# bryce-allow-mumble:
# iptables -A INPUT_CLIENT_BRYCE -p tcp --dport 64738 -j ACCEPT
# iptables -A INPUT_CLIENT_BRYCE -p udp --dport 64738 -j ACCEPT
#
# every client will be blocked on everything else by default
# iptables -A INPUT_CLIENT_BRYCE -j DROP
# iptables -A FORWARD_CLIENT_BRYCE -j DROP
#
# then whenever this config is reapplied, the entire client can be reset by resetting the whole chain unique to them
# sudo iptables -L | grep 'Chain .*_CLIENT_{clientname}' | awk '{print $2}'
# iptables -F INPUT_CLIENT_BRYCE
# iptables -F FORWARD_CLIENT_BRYCE
#
# or if a client is completely removed:
# iptables -D INPUT -s 10.153.150.4 -j INPUT_CLIENT_BRYCE #remove single entry from INPUT
# iptables -X INPUT_CLIENT_BRYCE #remove the client-specific chain
# same for FORWARD
